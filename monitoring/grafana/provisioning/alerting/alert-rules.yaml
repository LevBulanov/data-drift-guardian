apiVersion: 1
groups:
    - orgId: 1
      name: Adversarial Validation
      folder: Drift Guardian
      interval: 10s
      rules:
        - uid: dfz3zg8qn3oxse
          title: AV Drift – Warning
          condition: C
          data:
            - refId: av_status
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    # Current adversarial validation status after at least 4 consecutive warning windows
                    max(drift_av_status)
                    and on()
                    (max(drift_av_status_streak{status="warning"}) >= 4)
                    # Require warning status to have persisted for at least 5 minutes
                    and on()
                    (min_over_time((max(drift_av_status) == bool 1)[5m:]) == 1)
                    and on()
                    (max(drift_av_status offset 5m) == 1)
                    # Return 0 while the AV status exists but does not meet the streak condition
                    or (0 * max(drift_av_status))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: av_status
            - refId: roc_auc
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max(drift_av_roc_auc)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: roc_auc
            - refId: worst_fold_auc
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max(drift_av_roc_auc_cv_min)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: worst_fold_auc
            - refId: cv_std
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max(drift_av_roc_auc_cv_std)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: cv_std
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: av_status
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          for: 0s
          noDataState: KeepLast
          execErrState: KeepLast
          annotations:
            action: Inspect the drift drivers and analysis context in the Adversarial Validation section.
            description: |-
                <b>Adversarial Validation Summary</b>
                • ROC AUC: <code>{{ printf "%.3f" $values.roc_auc.Value }}</code>
                • Worst-fold AUC: <code>{{ printf "%.3f" $values.worst_fold_auc.Value }}</code>
                • CV std: <code>{{ printf "%.3f" $values.cv_std.Value }}</code>
            summary: Potential dataset shift was detected by adversarial validation.
          labels:
            domain: adversarial_validation
            owner: ml_monitoring
            service: drift_guardian
            severity: warning
          isPaused: false
          notification_settings:
            receiver: Drift Guardian Alerts Telegram
            active_time_intervals:
                - working-hours
