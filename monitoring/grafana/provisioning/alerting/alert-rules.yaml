    - orgId: 1
      name: Stream Health
      folder: Drift Guardian
      interval: 10s
      rules:
        - uid: streamwarn01
          title: Stream Health – Warning
          condition: C
          data:
            - refId: stream_status
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    # Calculate 0/1/2 status for every configured stream metric
                    (
                      (
                        label_replace(drift_event_time_lag_seconds, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                        or label_replace(drift_window_time_span_seconds, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                        or label_replace(drift_max_event_gap_seconds, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                        or label_replace(drift_invalid_event_time_rate, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                        or label_replace(drift_late_event_rate, "metric", "drift_late_event_rate", "__name__", ".*")
                      )
                      >= bool on(metric)
                      drift_stream_threshold{level="warning"}
                    )
                    + on(metric)
                    (
                      (
                        label_replace(drift_event_time_lag_seconds, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                        or label_replace(drift_window_time_span_seconds, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                        or label_replace(drift_max_event_gap_seconds, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                        or label_replace(drift_invalid_event_time_rate, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                        or label_replace(drift_late_event_rate, "metric", "drift_late_event_rate", "__name__", ".*")
                      )
                      >= bool on(metric)
                      drift_stream_threshold{level="critical"}
                    )
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: stream_status
            - refId: metric_value
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    label_replace(drift_event_time_lag_seconds, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                    or label_replace(drift_window_time_span_seconds, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                    or label_replace(drift_max_event_gap_seconds, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                    or label_replace(drift_invalid_event_time_rate, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                    or label_replace(drift_late_event_rate, "metric", "drift_late_event_rate", "__name__", ".*")
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: metric_value
            - refId: warning_threshold
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: max by (metric) (drift_stream_threshold{level="warning"})
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: warning_threshold
            - refId: critical_threshold
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: max by (metric) (drift_stream_threshold{level="critical"})
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: critical_threshold
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: stream_status
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          for: 5m
          noDataState: KeepLast
          execErrState: KeepLast
          annotations:
            action: Inspect Stream Health and the producer/consumer event-time pipeline.
            list_label: metric
            list_title: Stream metrics above warning threshold
            list_value: 'value={{ printf "%.4f" $values.metric_value.Value }}, warning={{ printf "%.4f" $values.warning_threshold.Value }}, critical={{ printf "%.4f" $values.critical_threshold.Value }}'
            summary: The following stream metrics have remained in warning status for at least 5 minutes.
          labels:
            domain: stream_health
            owner: ml_monitoring
            scope: list
            service: drift_guardian
            severity: warning
