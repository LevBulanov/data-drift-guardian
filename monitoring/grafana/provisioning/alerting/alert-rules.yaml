                        or label_replace(drift_max_event_gap_seconds, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                        or label_replace(drift_invalid_event_time_rate, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                        or label_replace(drift_late_event_rate, "metric", "drift_late_event_rate", "__name__", ".*")
                      )
                      >= bool on(metric)
                      drift_stream_threshold{level="critical"}
                    )
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: stream_status
            - refId: metric_value
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    label_replace(drift_event_time_lag_seconds, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                    or label_replace(drift_window_time_span_seconds, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                    or label_replace(drift_max_event_gap_seconds, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                    or label_replace(drift_invalid_event_time_rate, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                    or label_replace(drift_late_event_rate, "metric", "drift_late_event_rate", "__name__", ".*")
