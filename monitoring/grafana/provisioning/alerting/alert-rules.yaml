apiVersion: 1
groups:
    - orgId: 1
      name: Adversarial Validation
      folder: Drift Guardian
      interval: 10s
      rules:
        - uid: dfz3zg8qn3oxse
          title: AV Drift – Warning
          condition: C
          data:
            - refId: av_status
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    # Current adversarial validation status after at least 4 consecutive warning windows
                    (
                      max(drift_av_status)
                      and on()
                      (max(drift_av_status_streak{status="warning"}) >= 4)
                    )
                    # Keep warning active while a new critical streak is maturing
                    or (
                      (max(drift_av_status) == bool 2)
                      unless on()
                      (
                        max(drift_av_status)
                        and on()
                        (max(drift_av_status_streak{status="critical"}) >= 4)
                      )
                    )
                    # Return 0 while AV status exists but neither condition is ready
                    or (0 * max(drift_av_status))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: av_status
            - refId: roc_auc
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max(drift_av_roc_auc)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: roc_auc
            - refId: worst_fold_auc
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max(drift_av_roc_auc_cv_min)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: worst_fold_auc
            - refId: cv_std
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max(drift_av_roc_auc_cv_std)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: cv_std
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: av_status
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          for: 0s
          noDataState: KeepLast
          execErrState: KeepLast
          annotations:
            action: Inspect the drift drivers and analysis context in the Adversarial Validation section.
            description: |-
                <b>Adversarial Validation Summary</b>
                • ROC AUC: <code>{{ printf "%.3f" $values.roc_auc.Value }}</code>
                • Worst-fold AUC: <code>{{ printf "%.3f" $values.worst_fold_auc.Value }}</code>
                • CV std: <code>{{ printf "%.3f" $values.cv_std.Value }}</code>
            summary: Potential dataset shift was detected by adversarial validation.
          labels:
            domain: adversarial_validation
            owner: ml_monitoring
            service: drift_guardian
            severity: warning
          isPaused: false
        - uid: cfz40uwii8a9sd
          title: AV Drift – Critical
          condition: C
          data:
            - refId: av_status
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    # Current adversarial validation status after at least 4 consecutive critical windows
                    max(drift_av_status)
                    and on()
                    (max(drift_av_status_streak{status="critical"}) >= 4)
                    # Return 0 while the AV status exists but does not meet the streak condition
                    or (0 * max(drift_av_status))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: av_status
            - refId: roc_auc
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max(drift_av_roc_auc)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: roc_auc
            - refId: worst_fold_auc
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max(drift_av_roc_auc_cv_min)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: worst_fold_auc
            - refId: cv_std
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max(drift_av_roc_auc_cv_std)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: cv_std
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 2
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: av_status
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          for: 0s
          noDataState: KeepLast
          execErrState: KeepLast
          annotations:
            action: Inspect the drift drivers and analysis context in the Adversarial Validation section.
            description: |-
                <b>Adversarial Validation Summary</b>
                • ROC AUC: <code>{{ printf "%.3f" $values.roc_auc.Value }}</code>
                • Worst-fold AUC: <code>{{ printf "%.3f" $values.worst_fold_auc.Value }}</code>
                • CV std: <code>{{ printf "%.3f" $values.cv_std.Value }}</code>
            summary: Critical dataset shift was detected by adversarial validation.
          labels:
            domain: adversarial_validation
            owner: ml_monitoring
            service: drift_guardian
            severity: critical
          isPaused: false
    - orgId: 1
      name: Stream Health
      folder: Drift Guardian
      interval: 10s
      rules:
        - uid: streamwarn01
          title: Stream Health – Warning
          condition: C
          data:
            - refId: stream_status
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    # Warning covers status 1 and bridges status 2 until critical is ready
                    (
                      (
                        (
                          label_replace(drift_event_time_lag_seconds{job="drift-exporter"}, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                          or label_replace(drift_window_time_span_seconds{job="drift-exporter"}, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                          or label_replace(drift_max_event_gap_seconds{job="drift-exporter"}, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                          or label_replace(drift_invalid_event_time_rate{job="drift-exporter"}, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                          or label_replace(drift_late_event_rate{job="drift-exporter"}, "metric", "drift_late_event_rate", "__name__", ".*")
                        )
                        >= bool on(instance, metric)
                        drift_stream_threshold{job="drift-exporter", level="warning"}
                      )
                      + on(instance, metric)
                      (
                        (
                          label_replace(drift_event_time_lag_seconds{job="drift-exporter"}, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                          or label_replace(drift_window_time_span_seconds{job="drift-exporter"}, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                          or label_replace(drift_max_event_gap_seconds{job="drift-exporter"}, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                          or label_replace(drift_invalid_event_time_rate{job="drift-exporter"}, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                          or label_replace(drift_late_event_rate{job="drift-exporter"}, "metric", "drift_late_event_rate", "__name__", ".*")
                        )
                        >= bool on(instance, metric)
                        drift_stream_threshold{job="drift-exporter", level="critical"}
                      )
                    ) > bool 0
                    unless on(instance, metric)
                    (
                      min_over_time((
                        label_replace(drift_event_time_lag_seconds{job="drift-exporter"}, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                        or label_replace(drift_window_time_span_seconds{job="drift-exporter"}, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                        or label_replace(drift_max_event_gap_seconds{job="drift-exporter"}, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                        or label_replace(drift_invalid_event_time_rate{job="drift-exporter"}, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                        or label_replace(drift_late_event_rate{job="drift-exporter"}, "metric", "drift_late_event_rate", "__name__", ".*")
                      )[1m:])
                      >= on(instance, metric)
                      drift_stream_threshold{job="drift-exporter", level="critical"}
                    )
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: stream_status
            - refId: metric_value
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    label_replace(drift_event_time_lag_seconds{job="drift-exporter"}, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                    or label_replace(drift_window_time_span_seconds{job="drift-exporter"}, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                    or label_replace(drift_max_event_gap_seconds{job="drift-exporter"}, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                    or label_replace(drift_invalid_event_time_rate{job="drift-exporter"}, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                    or label_replace(drift_late_event_rate{job="drift-exporter"}, "metric", "drift_late_event_rate", "__name__", ".*")
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: metric_value
            - refId: warning_threshold
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: max by (instance, metric) (drift_stream_threshold{job="drift-exporter", level="warning"})
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: warning_threshold
            - refId: critical_threshold
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: max by (instance, metric) (drift_stream_threshold{job="drift-exporter", level="critical"})
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: critical_threshold
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: stream_status
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          for: 5m
          noDataState: KeepLast
          execErrState: KeepLast
          annotations:
            action: Inspect Stream Health and the producer/consumer event-time pipeline.
            list_label: metric
            list_title: Stream metrics above warning threshold
            list_value: 'value={{ printf "%.4f" $values.metric_value.Value }}, warning={{ printf "%.4f" $values.warning_threshold.Value }}, critical={{ printf "%.4f" $values.critical_threshold.Value }}'
            summary: The following stream metrics have remained in warning status for at least 5 minutes.
          labels:
            domain: stream_health
            owner: data_engineering
            scope: list
            service: drift_guardian
            severity: warning
          isPaused: false
        - uid: streamcrit01
          title: Stream Health – Critical
          condition: C
          data:
            - refId: stream_status
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    # Calculate 0/1/2 status for every configured stream metric
                    (
                      (
                        label_replace(drift_event_time_lag_seconds{job="drift-exporter"}, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                        or label_replace(drift_window_time_span_seconds{job="drift-exporter"}, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                        or label_replace(drift_max_event_gap_seconds{job="drift-exporter"}, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                        or label_replace(drift_invalid_event_time_rate{job="drift-exporter"}, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                        or label_replace(drift_late_event_rate{job="drift-exporter"}, "metric", "drift_late_event_rate", "__name__", ".*")
                      )
                      >= bool on(instance, metric)
                      drift_stream_threshold{job="drift-exporter", level="warning"}
                    )
                    + on(instance, metric)
                    (
                      (
                        label_replace(drift_event_time_lag_seconds{job="drift-exporter"}, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                        or label_replace(drift_window_time_span_seconds{job="drift-exporter"}, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                        or label_replace(drift_max_event_gap_seconds{job="drift-exporter"}, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                        or label_replace(drift_invalid_event_time_rate{job="drift-exporter"}, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                        or label_replace(drift_late_event_rate{job="drift-exporter"}, "metric", "drift_late_event_rate", "__name__", ".*")
                      )
                      >= bool on(instance, metric)
                      drift_stream_threshold{job="drift-exporter", level="critical"}
                    )
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: stream_status
            - refId: metric_value
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    label_replace(drift_event_time_lag_seconds{job="drift-exporter"}, "metric", "drift_event_time_lag_seconds", "__name__", ".*")
                    or label_replace(drift_window_time_span_seconds{job="drift-exporter"}, "metric", "drift_window_time_span_seconds", "__name__", ".*")
                    or label_replace(drift_max_event_gap_seconds{job="drift-exporter"}, "metric", "drift_max_event_gap_seconds", "__name__", ".*")
                    or label_replace(drift_invalid_event_time_rate{job="drift-exporter"}, "metric", "drift_invalid_event_time_rate", "__name__", ".*")
                    or label_replace(drift_late_event_rate{job="drift-exporter"}, "metric", "drift_late_event_rate", "__name__", ".*")
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: metric_value
            - refId: warning_threshold
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: max by (instance, metric) (drift_stream_threshold{job="drift-exporter", level="warning"})
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: warning_threshold
            - refId: critical_threshold
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: max by (instance, metric) (drift_stream_threshold{job="drift-exporter", level="critical"})
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: critical_threshold
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 2
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: stream_status
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          for: 1m
          noDataState: KeepLast
          execErrState: KeepLast
          annotations:
            action: Inspect Stream Health and the producer/consumer event-time pipeline immediately.
            list_label: metric
            list_title: Stream metrics above critical threshold
            list_value: 'value={{ printf "%.4f" $values.metric_value.Value }}, warning={{ printf "%.4f" $values.warning_threshold.Value }}, critical={{ printf "%.4f" $values.critical_threshold.Value }}'
            summary: The following stream metrics have remained in critical status for at least 1 minute.
          labels:
            domain: stream_health
            owner: data_engineering
            scope: list
            service: drift_guardian
            severity: critical
          isPaused: false
    - orgId: 1
      name: Prediction Drift
      folder: Drift Guardian
      interval: 10s
      rules:
        - uid: efz3u94rcw6bke
          title: Prediction Drift Metrics – Warning
          condition: C
          data:
            - refId: metric_status
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    # Current warning prediction metrics after at least 4 consecutive windows
                    max by (feature, metric) (
                      drift_status{feature="prediction"}
                      and on(feature, type, metric)
                      (drift_status_streak{feature="prediction", status="warning"} >= 4)
                      # Require warning status to have persisted for at least 5 minutes
                      and on(feature, type, metric)
                      (min_over_time((drift_status{feature="prediction"} == bool 1)[5m:]) == 1)
                      and on(feature, type, metric)
                      (drift_status{feature="prediction"} offset 5m == 1)
                    )
                    # Keep warning active while the matching critical condition is maturing
                    or on(feature, metric)
                    max by (feature, metric) (
                      (drift_status{feature="prediction"} == bool 2)
                      unless on(feature, type, metric)
                      (
                        drift_status{feature="prediction"}
                        and on(feature, type, metric)
                        (drift_status_streak{feature="prediction", status="critical"} >= 4)
                        and on(feature, type, metric)
                        (min_over_time((drift_status{feature="prediction"} == bool 2)[5m:]) == 1)
                        and on(feature, type, metric)
                        (drift_status{feature="prediction"} offset 5m == 2)
                      )
                    )
                    # Return 0 for prediction metrics that do not meet the streak condition
                    or on(feature, metric)
                    (0 * max by (feature, metric) (drift_status{feature="prediction"}))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: metric_status
            - refId: metric_value
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: max by (feature, metric) (drift_metric_value{feature="prediction"})
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: metric_value
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: metric_status
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          for: 0s
          noDataState: KeepLast
          execErrState: KeepLast
          annotations:
            action: Inspect the affected metrics in the Prediction Drift section.
            list_label: metric
            list_title: Affected metrics
            list_value: '{{ $values.metric_value.Value }}'
            summary: The following prediction metrics have reached warning status compared with the reference data.
          labels:
            domain: prediction_drift
            owner: ml_monitoring
            scope: list
            service: drift_guardian
            severity: warning
          isPaused: false
        - uid: afz3v51xspjpca
          title: Prediction Drift Status – Warning
          condition: C
          data:
            - refId: prediction_status
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                editorMode: code
                expr: |-
                    # Current prediction status after at least 4 consecutive warning windows
                    (
                      max(
                        drift_status_feature{feature="prediction"}
                        and on(feature, type)
                        (drift_status_feature_streak{feature="prediction", status="warning"} >= 4)
                        # Require warning status to have persisted for at least 5 minutes
                        and on(feature, type)
                        (min_over_time((drift_status_feature{feature="prediction"} == bool 1)[5m:]) == 1)
                        and on(feature, type)
                        (drift_status_feature{feature="prediction"} offset 5m == 1)
                      )
                    )
                    # Keep warning active while the critical condition is maturing
                    or max(
                      (drift_status_feature{feature="prediction"} == bool 2)
                      unless on(feature, type)
                      (
                        drift_status_feature{feature="prediction"}
                        and on(feature, type)
                        (drift_status_feature_streak{feature="prediction", status="critical"} >= 4)
                        and on(feature, type)
                        (min_over_time((drift_status_feature{feature="prediction"} == bool 2)[5m:]) == 1)
                        and on(feature, type)
                        (drift_status_feature{feature="prediction"} offset 5m == 2)
                      )
                    )
                    # Return 0 while prediction status exists but does not meet the streak condition
                    or (0 * max(drift_status_feature{feature="prediction"}))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: prediction_status
            - refId: metric_count
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cfxnbdacrd728d
              model:
                datasource:
                    type: prometheus
                    uid: cfxnbdacrd728d
                editorMode: code
                expr: count(drift_status{feature="prediction"} == 1) or vector(0)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: metric_count
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: prediction_status
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          for: 0s
          noDataState: KeepLast
          execErrState: KeepLast
          annotations:
            action: Inspect the affected metrics in the Prediction Drift section.
